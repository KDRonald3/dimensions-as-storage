[project]
name = "air"
version = "0.1.0"
description = "A small experiment: does a bigger vocabulary need a bigger language model?"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch",
    "numpy",
    "matplotlib",
]

[dependency-groups]
dev = [
    "pytest",
]

# The code is a handful of scripts at the top of the repository, not an installable package.
[tool.uv]
package = false

# Take torch from the CPU-only index: the models here are tiny and need no graphics card.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
